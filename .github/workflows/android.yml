name: Build Android APK

on:
  push:
    branches: ['**']
    paths: ['www/**', 'package.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Lock to portrait orientation
        run: sed -i 's/<activity\b/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MythPals-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
